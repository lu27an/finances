<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finances - Controle Financeiro Pessoal</title>
    <meta name="description" content="Um controle financeiro pessoal, simples, offline-first e seguro. Todos os dados permanecem salvos localmente em seu navegador.">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Container wrapped for centering on Desktop -->
    <main class="app-wrapper">
        <div class="device-frame">
            <!-- App Header -->
            <header class="app-header">
                <div class="header-top">
                    <div class="brand">
                        <span class="brand-logo">✨</span>
                        <h1>Finances</h1>
                    </div>
                    <button id="settings-btn" class="icon-btn" aria-label="Configurações">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>

                <!-- Balance Summary Dashboard (Glass Cards) -->
                <div class="dashboard-card">
                    <div class="balance-container">
                        <span class="balance-label">Saldo Atual</span>
                        <div id="total-balance" class="balance-value">R$ 0,00</div>
                    </div>
                    
                    <div class="metrics-grid">
                        <div class="metric-item income">
                            <div class="metric-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                            </div>
                            <div class="metric-data">
                                <span class="metric-label">Receitas</span>
                                <span id="total-income" class="metric-value">R$ 0,00</span>
                            </div>
                        </div>
                        <div class="metric-item expense">
                            <div class="metric-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                            </div>
                            <div class="metric-data">
                                <span class="metric-label">Despesas</span>
                                <span id="total-expense" class="metric-value">R$ 0,00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Month Selector Carousel -->
                <nav class="month-carousel" aria-label="Seleção de Mês">
                    <button id="prev-month" class="arrow-btn" aria-label="Mês Anterior">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <span id="current-month-display" class="current-month">Maio 2026</span>
                    <button id="next-month" class="arrow-btn" aria-label="Próximo Mês">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </nav>
            </header>

            <!-- Main Scrollable Feed -->
            <section class="transactions-container">
                <h2 class="section-title">Histórico de Transações</h2>
                
                <!-- List target -->
                <div id="transactions-list" class="transactions-list">
                    <!-- Dynamic transactions go here -->
                </div>

                <!-- Empty state visual -->
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-state-icon">💸</div>
                    <h3>Nenhum registro encontrado</h3>
                    <p>Comece tocando no botão abaixo para adicionar sua primeira transação!</p>
                </div>
            </section>

            <!-- Floating Action Button (FAB) -->
            <button id="fab-btn" class="fab-button" aria-label="Nova Transação">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>

            <!-- Bottom Sheet Modal Form -->
            <div id="bottom-sheet-backdrop" class="bottom-sheet-backdrop hidden"></div>
            <section id="transaction-sheet" class="bottom-sheet hidden">
                <div class="sheet-header">
                    <div class="sheet-drag-handle"></div>
                    <div class="sheet-title-container">
                        <h2>Nova Transação</h2>
                        <button id="close-sheet-btn" class="close-btn" aria-label="Fechar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>

                <form id="transaction-form" class="sheet-body" novalidate>
                    <!-- Type Selector (Income vs Expense) -->
                    <div class="type-selector-group">
                        <label class="type-toggle-btn active-expense">
                            <input type="radio" name="tx-type" value="expense" checked>
                            <span>Despesa</span>
                        </label>
                        <label class="type-toggle-btn">
                            <input type="radio" name="tx-type" value="income">
                            <span>Receita</span>
                        </label>
                    </div>

                    <!-- Large Input Value -->
                    <div class="value-input-group">
                        <span class="currency-prefix">R$</span>
                        <input type="number" id="tx-amount" placeholder="0,00" step="0.01" min="0.01" inputmode="decimal" required autocomplete="off">
                    </div>

                    <!-- Category Selector (Grid) -->
                    <div class="input-label-container">
                        <span class="input-label">Categoria</span>
                    </div>
                    <div id="category-grid" class="category-grid">
                        <!-- Dynamic emoji categories populated via JS -->
                    </div>

                    <!-- Additional Details -->
                    <div class="fields-row">
                        <div class="field-item">
                            <label for="tx-date" class="input-label">Data</label>
                            <input type="date" id="tx-date" required>
                        </div>
                        <div class="field-item">
                            <label for="tx-description" class="input-label">Descrição</label>
                            <input type="text" id="tx-description" placeholder="Ex: Mercado, Salário..." autocomplete="off">
                        </div>
                    </div>

                    <button type="submit" id="save-tx-btn" class="submit-btn">Confirmar</button>
                </form>
            </section>

            <!-- Settings Sheet Modal -->
            <div id="settings-backdrop" class="bottom-sheet-backdrop hidden"></div>
            <section id="settings-sheet" class="bottom-sheet hidden">
                <div class="sheet-header">
                    <div class="sheet-drag-handle"></div>
                    <div class="sheet-title-container">
                        <h2>Configurações</h2>
                        <button id="close-settings-btn" class="close-btn" aria-label="Fechar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <div class="sheet-body settings-body">
                    <p class="settings-desc">Seus dados são salvos localmente e 100% privados.</p>
                    
                    <div class="settings-actions">
                        <button id="export-btn" class="settings-action-btn primary-action">
                            <span>📤 Exportar Backup (JSON)</span>
                        </button>
                        <button id="import-trigger-btn" class="settings-action-btn secondary-action">
                            <span>📥 Importar Backup (JSON)</span>
                        </button>
                        <input type="file" id="import-file-input" accept=".json" class="hidden">
                        
                        <button id="reset-btn" class="settings-action-btn danger-action">
                            <span>🗑️ Limpar Todos os Dados</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- App Entry Scripts -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
